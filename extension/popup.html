<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drape</title>
  <style>
    :root { --ink: #1e1b22; --soft: #5a5560; --plum: #5e2750; --paper: #f8f5f0; --line: #e3dbd0; }
    body { margin: 0; width: 320px; background: var(--paper); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    header img { width: 24px; height: 24px; }
    header strong { font-size: 16px; }
    main { padding: 16px; display: grid; gap: 12px; }
    h1 { font-size: 16px; margin: 0; }
    p { margin: 0; color: var(--soft); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); }
    button { min-height: 44px; border: 0; background: var(--plum); color: #fff; font-weight: 600; font-size: 15px; font-family: inherit; border-radius: 4px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #5e2750; outline-offset: 2px; }
    small { color: var(--soft); }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><strong>Drape</strong></header>
  <main id="main" aria-live="polite"><p>Checking this page…</p></main>
  <script src="popup.js"></script>
</body>
</html>
