<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1500px;height:1000px;background:#F8F5F0;font-family:'IBM Plex Sans',sans-serif;color:#1E1B22;display:flex;overflow:hidden}
.left{width:640px;padding:90px 30px 80px 90px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:22px;margin-bottom:44px}
.brand img{width:96px;height:96px;border-radius:22px}
.brand span{font-family:Jost;font-weight:600;font-size:96px;letter-spacing:-1px}
h1{font-family:Jost;font-weight:600;font-size:62px;line-height:1.08;margin-bottom:30px}
h1 em{font-style:normal;color:#1D6B46}
p{font-size:30px;line-height:1.35;color:#5A5560;margin-bottom:46px}
.by{display:inline-block;align-self:flex-start;background:#5E2750;color:#fff;font-weight:600;font-size:28px;padding:14px 26px;border-radius:999px}
.right{flex:1;display:flex;gap:26px;padding:60px 70px 60px 10px;align-items:center}
.card{flex:1;background:#fff;border:2px solid #E3DBD0;border-radius:28px;padding:14px;display:flex;flex-direction:column}
.card img{width:100%;height:720px;object-fit:cover;object-position:50% 12%;border-radius:18px}
.pill{margin:16px 4px 4px;align-self:flex-start;white-space:nowrap;font-weight:600;font-size:24px;padding:10px 16px;border-radius:999px}
.yes{background:#E4F1E9;color:#1D6B46}.no{background:#F8E6E2;color:#A0372A}
</style></head><body>
<div class="left">
 <div class="brand"><img src="../../../app/web/icons/Icon-512.png"><span>Drape</span></div>
 <h1>Which colour is <em>yours?</em></h1>
 <p>One photo reads your colouring. See the colour that suits you beside the one that fights you, on your own body.</p>
 <div class="by">Powered by YouCam API</div>
</div>
<div class="right">
 <div class="card"><img src="../../../backend/public/persona/tryon_abaya-classic_emerald.jpg"><div class="pill yes">✓ Lifts your colouring</div></div>
 <div class="card"><img src="../../../backend/public/persona/tryon_abaya-classic_lavender.jpg"><div class="pill no">✕ Fights your colouring</div></div>
</div>
</body></html>
