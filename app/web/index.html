<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Drape reads your skin, hair and eye colours, then shows each colour of a garment on your own body.">
  <meta name="theme-color" content="#F1F2EC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drape">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Drape</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F1F2EC; color: #1D2723; }
    #drape-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font: 17px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    #drape-loading .mark { font-size: 30px; letter-spacing: .04em; font-weight: 600; }
    #drape-loading .bar { width: 140px; height: 3px; background: #C6CEC3; overflow: hidden; border-radius: 2px; }
    #drape-loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #7B2D43; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #drape-loading .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="drape-loading" role="status" aria-live="polite">
    <div class="mark">Drape</div>
    <div class="bar"></div>
    <div>Loading your fitting room…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('drape-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
